name: CI

# Two tiers, because GitHub Actions minutes are budgeted (~/.claude/CLAUDE.md,
# Workflow): a fast tier on every PR push and every push to main, and the full
# browser suite only where it pays. Copy this file into a new repo's
# .github/workflows/ and delete the jobs or steps the repo has nothing for.
#
#   - pull_request and push to main: lint, typecheck, unit and fast integration
#     tests, build, and a Playwright smoke set if the repo is a web app (the
#     describes tagged @smoke). A newer push cancels the older run on a PR,
#     never on main or a tag.
#   - tag v* (a release), the weekly schedule and a manual run: the full
#     Playwright suite too. A red scheduled run reports to one issue, since no
#     PR is there to turn red.
#   - a change to docs or feature readmes alone runs nothing. A doc a test
#     reads must be re-included (`- 'docs/the-file.md'` after the negation).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**'
      - '!docs/**'
      - '!**/feature_readme.md'
      - '!README.md'
      - '!AGENTS.md'
      - '!CLAUDE.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/feature_readme.md'
      - '!README.md'
      - '!AGENTS.md'
      - '!CLAUDE.md'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The event is part of the group: the weekly run and a push to main share
# `github.ref`, and GitHub replaces a pending run in a group whatever
# cancel-in-progress says, so without it a merge could cancel the weekly run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The fast tier's smoke set; the full tier runs those specs with the rest.
  RUN_SMOKE: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Web apps only: the describes tagged @smoke (sign-in, home, the header
      # at 390, the route guards), `playwright test --grep @smoke`. Keep it
      # under a few minutes. Delete these steps in a service repo.
      - run: npx playwright install --with-deps chromium
        if: env.RUN_SMOKE == 'true'
      - run: npm run test:e2e:smoke
        if: env.RUN_SMOKE == 'true'

  e2e-full:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # A red weekly run has no PR to turn red, so it reports to an issue: one per
  # regression (a comment on the open one, a new one otherwise). The workflow
  # token has no project scope, so the issue still goes on the board by hand.
  report-weekly:
    needs: [e2e-full]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: 'Weekly e2e run failed on main'
    steps:
      - name: Open the issue, or comment on the open one
        run: |
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still red on $(date -u +%Y-%m-%d): $RUN_URL"
          else
            gh issue create --title "$TITLE ($(date -u +%Y-%m-%d))" \
              --body "The scheduled full Playwright run failed: $RUN_URL. Add this issue to the project board."
          fi
